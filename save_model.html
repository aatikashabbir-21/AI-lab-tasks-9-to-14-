<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Save OPR SVM Model</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f4;
        }
        .container {
            background-color: white;
            padding: 30px;
            margin: auto;
            width: 400px;
            box-shadow: 0px 0px 10px #aaa;
            border-radius: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        h1 {
            margin-bottom: 20px;
        }
        p {
            color: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Save OPR SVM Model</h1>
        <form action="/save_model" method="post">
            <button type="submit">Save Model</button>
        </form>
        {% if message %}
            <p>{{ message }}</p>
        {% endif %}
    </div>
</body>
</html>
